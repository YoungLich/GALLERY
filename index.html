<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/responsive.css">
    <link rel="icon" type="icon" href="icons/icon.png">
    <title>GALLERY</title>
</head>

<body>
    <h1 class="gradient">GALLERY</h1>

    <div class="gallery-container">
        <div class="frame-container">
            <!-- Moldura Desktop -->
            <div class="flip-frame desktop-frame">
                <div class="flip" id="desktopFlip">
                    <div class="slide front">
                        <div class="image-wrapper">
                            <img class="wallpaper-image" id="desktopCurrent" src="" alt="Desktop Wallpaper">
                        </div>
                    </div>
                    <div class="slide back">
                        <div class="image-wrapper">
                            <img class="wallpaper-image" id="desktopNext" src="" alt="Desktop Wallpaper">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Moldura Mobile -->
            <div class="flip-frame mobile-frame">
                <div class="flip" id="mobileFlip">
                    <div class="slide front">
                        <div class="image-wrapper">
                            <img class="wallpaper-image" id="mobileCurrent" src="" alt="Mobile Wallpaper">
                        </div>
                    </div>
                    <div class="slide back">
                        <div class="image-wrapper">
                            <img class="wallpaper-image" id="mobileNext" src="" alt="Mobile Wallpaper">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav">
        <button id="prev">Anterior</button>
        <button id="next">Próximo</button>
        <button id="downloadDesktop">Download Desktop</button>
        <button id="downloadMobile">Download Mobile</button>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
